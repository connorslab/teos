name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_configure.py
      - run: python3 tools/configure.py examples/watchtower.toml --check
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 build --locked --workspace
      - run: cargo +1.88.0 test --locked --workspace
  lnd:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: lnd/go.sum
      - run: go build -mod=readonly -tags='watchtowerrpc wtclientrpc signrpc walletrpc chainrpc invoicesrpc routerrpc' ./cmd/lnd ./cmd/lncli
      - run: go test -mod=readonly ./watchtower/...

